# ============================================================================
# APPLICATION : iCredit
# ============================================================================
# Fichier généré à partir de la matrice Ardian.
# 1 fichier = 1 Application = 1 Catalogue Entitlement Management.
# ============================================================================

app_name: "icredit"
app_description: "Description iCredit"

access_packages:

  # ==========================================================================
  # AP 1 : "Private Credit Read Only - UAT"
  # ==========================================================================
  # Nom construit : [Private Credit] [Read Only] - [UAT]
  # Politique : Owner Only (assignation directe par admin)
  # ==========================================================================

  - context_subapp: "Private Credit"
    privilege_level: "Read Only"
    env: "UAT"
    description: "Decription de l'autorisation"
    authorization_owners:
      - "mail@monentreprise.com"
      - "mail2@monentreprise.com"
    owner_only: true

    resources:
      - resource_type: "Application Role"
        enterprise_app: "app-frontend"
        app_role: "Private Credit ReadOnly"

      - resource_type: "Application Role"
        enterprise_app: "app-backend"
        app_role: "Private Credit ReadOnly"

  # ==========================================================================
  # AP 2 : "Private Credit User - UAT"
  # ==========================================================================
  # Nom construit : [Private Credit] [User] - [UAT]
  # Politique : Owner Only (assignation directe par admin)
  # ==========================================================================

  - context_subapp: "Private Credit"
    privilege_level: "User"
    env: "UAT"
    description: "Decription de l'autorisation"
    authorization_owners:
      - "mail@monentreprise.com"
      - "mail2@monentreprise.com"
    owner_only: true

    resources:
      - resource_type: "Application Role"
        enterprise_app: "app-frontend"
        app_role: "Private Credit User"

      - resource_type: "Application Role"
        enterprise_app: "app-backend"
        app_role: "Private Credit User"

  # ==========================================================================
  # AP 3 : "Private Credit Read Only - Prod"
  # ==========================================================================
  # Nom construit : [Private Credit] [Read Only] - [Prod]
  # Politique : Self-service (demande via MyAccess, soumise à approbation)
  # ==========================================================================

  - context_subapp: "Private Credit"
    privilege_level: "Read Only"
    env: "Prod"
    description: "Decription de l'autorisation"
    authorization_owners:
      - "mail@monentreprise.com"
      - "mail2@monentreprise.com"
    owner_only: false

    resources:
      - resource_type: "Application Role"
        enterprise_app: "app-frontend"
        app_role: "Private Credit ReadOnly"

      - resource_type: "Application Role"
        enterprise_app: "app-backend"
        app_role: "Private Credit ReadOnly"

  # ==========================================================================
  # AP 4 : "Private Credit IT Access - Prod"
  # ==========================================================================
  # Nom construit : [Private Credit] [IT Access] - [Prod]
  # Politique : Self-service (demande via MyAccess, soumise à approbation)
  # ==========================================================================

  - context_subapp: "Private Credit"
    privilege_level: "IT Access"
    env: "Prod"
    description: "Decription de l'autorisation"
    authorization_owners:
      - "mail@monentreprise.com"
      - "mail2@monentreprise.com"
    owner_only: false

    resources:
      - resource_type: "Application Role"
        enterprise_app: "app-frontend"
        app_role: "Private Credit IT Access"

      - resource_type: "Application Role"
        enterprise_app: "app-backend"
        app_role: "Private Credit IT Access"
