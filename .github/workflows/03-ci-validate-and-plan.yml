# ============================================================================
# Workflow : CI - Validation Schema & Terraform Plan
# ============================================================================
name: "\U0001F50D CI \u2014 Validation & Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - 'declarations/apps/**'
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  validate-schema:
    name: "\U0001F4CB Validation Schema"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Detect changed YAML files
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'declarations/apps/*.yaml' | grep -v '^declarations/apps/_' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No YAML files changed."
            echo "files=" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Changed YAML files:"
            echo "$CHANGED_FILES"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "files<<$EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
            echo "count=$(echo \"$CHANGED_FILES\" | wc -l)" >> $GITHUB_OUTPUT
          fi

      - name: Validate each YAML file
        if: steps.changed.outputs.count != '0'
        run: |
          ERRORS=0

          while IFS= read -r file; do
            echo "================================================"
            echo "Validating: $file"
            echo "================================================"

            python .github/scripts/validate-schema.py \
              --yaml-file "$file" \
              --schema-file schemas/app-declaration.schema.json || ERRORS=$((ERRORS + 1))

            echo ""
          done <<< "${{ steps.changed.outputs.files }}"

          if [ $ERRORS -gt 0 ]; then
            echo "$ERRORS file(s) failed validation."
            exit 1
          fi

          echo "All YAML files are valid."

  terraform-plan:
    name: "\U0001F3D7\uFE0F Terraform Plan"
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'
          terraform_wrapper: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt

          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $PLAN_EXIT_CODE -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi
        continue-on-error: true

      - name: Generate human-readable summary
        id: summary
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_FILE="plan_output.txt"
          SUMMARY_FILE="plan_summary.md"

          echo "## 📋 Résumé des changements prévus dans Entra ID" > $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # Extraire les créations
          CREATES=$(grep -c '# .* will be created' $PLAN_FILE 2>/dev/null || echo "0")
          UPDATES=$(grep -c '# .* will be updated' $PLAN_FILE 2>/dev/null || echo "0")
          DESTROYS=$(grep -c '# .* will be destroyed' $PLAN_FILE 2>/dev/null || echo "0")
          REPLACES=$(grep -c '# .* must be replaced' $PLAN_FILE 2>/dev/null || echo "0")
          NOCHANGE=$(grep -c 'No changes.' $PLAN_FILE 2>/dev/null || echo "0")

          echo "| Action | Nombre |" >> $SUMMARY_FILE
          echo "|--------|--------|" >> $SUMMARY_FILE
          echo "| 🆕 Créations | $CREATES |" >> $SUMMARY_FILE
          echo "| ✏️ Modifications | $UPDATES |" >> $SUMMARY_FILE
          echo "| 🗑️ Suppressions | $DESTROYS |" >> $SUMMARY_FILE
          echo "| 🔄 Remplacements | $REPLACES |" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE

          # Détail des créations
          if [ "$CREATES" -gt 0 ]; then
            echo "### 🆕 Ressources à créer" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            grep '# .* will be created' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be created//')
              # Extraire le type lisible
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              case "$TYPE" in
                access_package_catalog) ICON="📦"; LABEL="Catalogue" ;;
                access_package) ICON="🎫"; LABEL="Access Package" ;;
                access_package_assignment_policy) ICON="📜"; LABEL="Politique d'assignation" ;;
                access_package_resource_catalog_association) ICON="🔗"; LABEL="Association ressource → catalogue" ;;
                access_package_resource_package_association) ICON="🔗"; LABEL="Association ressource → package" ;;
                *) ICON="📌"; LABEL="$TYPE" ;;
              esac
              echo "- $ICON **$LABEL** : \`$KEY\`" >> $SUMMARY_FILE
            done
            echo "" >> $SUMMARY_FILE
          fi

          # Détail des modifications
          if [ "$UPDATES" -gt 0 ]; then
            echo "### ✏️ Ressources à modifier" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            grep '# .* will be updated' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be updated in-place//')
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              echo "- ✏️ **$TYPE** : \`$KEY\`" >> $SUMMARY_FILE
            done
            echo "" >> $SUMMARY_FILE
          fi

          # Détail des suppressions
          if [ "$DESTROYS" -gt 0 ]; then
            echo "### 🗑️ Ressources à supprimer" >> $SUMMARY_FILE
            echo "" >> $SUMMARY_FILE
            grep '# .* will be destroyed' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be destroyed//')
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              echo "- 🗑️ **$TYPE** : \`$KEY\`" >> $SUMMARY_FILE
            done
            echo "" >> $SUMMARY_FILE
          fi

          if [ "$NOCHANGE" -gt 0 ] && [ "$CREATES" -eq 0 ] && [ "$UPDATES" -eq 0 ] && [ "$DESTROYS" -eq 0 ]; then
            echo "✅ **Aucun changement détecté** — l'infrastructure Entra ID est déjà à jour." >> $SUMMARY_FILE
          fi

          cat $SUMMARY_FILE

          # Store for PR comment
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "content<<$EOF" >> $GITHUB_OUTPUT
          cat $SUMMARY_FILE >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Post Plan result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read plan output
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            } catch (e) {
              planOutput = 'Plan output not available.';
            }

            // Read summary
            let summaryContent = '';
            try {
              summaryContent = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_summary.md', 'utf8');
            } catch (e) {
              summaryContent = '⚠️ Résumé non disponible.';
            }

            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const hasChanges = summaryContent.includes('🆕') || summaryContent.includes('✏️') || summaryContent.includes('🗑️');

            let status, emoji;
            if (exitCode === '1') {
              status = 'Erreur lors du plan';
              emoji = '❌';
            } else if (hasChanges) {
              status = 'Changements détectés (prêts pour validation)';
              emoji = '📋';
            } else {
              status = 'Aucun changement détecté';
              emoji = '✅';
            }

            const maxLen = 50000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (sortie tronquée)'
              : planOutput;

            const body = [
              `## ${emoji} Terraform Plan — ${status}`,
              '',
              summaryContent,
              '',
              '---',
              '',
              '<details>',
              '<summary>🔍 Afficher le plan Terraform complet</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '</details>',
              '',
              exitCode === '1'
                ? [
                    '> [!CAUTION]',
                    '> Le plan a échoué. Vérifiez que toutes les ressources référencées',
                    '> (groupes, applications) existent bien dans **Entra ID**.',
                  ].join('\n')
                : [
                    '> [!NOTE]',
                    '> Ce plan sera appliqué automatiquement après le merge sur `main`.',
                    '> **Vérifiez attentivement le résumé ci-dessus avant de merger.**',
                  ].join('\n'),
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body,
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "Terraform plan failed. See PR comment for details."
          exit 1