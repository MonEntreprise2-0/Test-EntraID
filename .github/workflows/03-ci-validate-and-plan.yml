# ============================================================================
# Workflow : CI — Pipeline de Validation à 3 Étapes
# ============================================================================
# Étape 1 : Syntaxe et conformité (JSON Schema, nommage 1 app = 1 dossier)
# Étape 2 : Détection des ressources Entra ID (Bloquant strict, relance via Re-run)
# Étape 3 : Validation Humaine (Approbation Admin requise)
# ============================================================================
name: "🔍 CI — Pipeline de Validation à 3 Étapes"

on:
  pull_request:
    branches: [main]
    paths:
      - 'declaration/**'
      - 'terraform/**'
      - 'schemas/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ===========================================================================
  # ÉTAPE 1 : Syntaxe et Conformité
  # ===========================================================================
  validate-schema:
    name: "📋 Étape 1 : Syntaxe & Conformité"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Détecter les fichiers YAML modifiés
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'declaration/**/*.yaml' | grep -v 'declaration/_' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "Aucun fichier déclaratif modifié."
            echo "files=" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Fichiers déclaratifs modifiés :"
            echo "$CHANGED_FILES"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "files<<$EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
            echo "count=$(echo \"$CHANGED_FILES\" | wc -l)" >> $GITHUB_OUTPUT
          fi

      - name: Valider chaque fichier contre le Schéma et le Nommage
        if: steps.changed.outputs.count != '0'
        run: |
          ERRORS=0

          while IFS= read -r file; do
            echo "================================================"
            echo "Validation en cours : $file"
            echo "================================================"

            python .github/scripts/validate-schema.py \
              --yaml-file "$file" \
              --schema-file schemas/app-declaration.schema.json || ERRORS=$((ERRORS + 1))

            echo ""
          done <<< "${{ steps.changed.outputs.files }}"

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS fichier(s) en échec de validation de schéma ou de nommage."
            exit 1
          fi

          echo "✅ Tous les fichiers déclaratifs sont conformes."

  # ===========================================================================
  # ÉTAPE 2 : Détection des Ressources Entra ID & Plan SSoT (Bloquant)
  # ===========================================================================
  detect-resources-and-plan:
    name: "🔎 Étape 2 : Détection des Ressources Entra ID"
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'
          terraform_wrapper: true

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init
          terraform state rm 'azuread_access_package_assignment_policy.this["cat-test03|AP_Test03|Politique de test"]' 2>/dev/null || true
          terraform state rm 'azuread_access_package_assignment_policy.this["private-credit|Credit Read Only - UAT|Politique"]' 2>/dev/null || true
          terraform state rm 'azuread_access_package_assignment_policy.this["private-credit|Credit Write - UAT|Politique"]' 2>/dev/null || true

      - name: 🧹 Nettoyage automatique des ressources orphelines du State
        run: |
          python .github/scripts/cleanup-stale-state.py --working-dir ${{ env.TF_WORKING_DIR }}

      - name: Smart Discovery des catalogues Entra ID
        run: |
          python .github/scripts/discover-catalogs.py \
            --declarations-dir declaration \
            --output-file terraform/discovered_catalogs.json

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan (Contrôle SSoT et détection des ressources)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -no-color \
            -out=tfplan.binary \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt

          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ -f tfplan.binary ]; then
            terraform show -json tfplan.binary > tfplan.json 2>/dev/null || true
          fi

          if [ $PLAN_EXIT_CODE -eq 1 ]; then
            echo "Terraform plan a échoué (ressources manquantes ou erreur de syntaxe)."
            exit 1
          fi
        continue-on-error: true

      - name: Synthèse et publication du résultat sur la PR
        id: summary
        if: always()
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'declaration/**/*.yaml' | grep -v 'declaration/_' || true)

          python .github/scripts/format-pr-comment.py \
            --changed-files "$CHANGED_FILES" \
            --tfplan-json "${{ env.TF_WORKING_DIR }}/tfplan.json" \
            --catalog-packages-json "${{ env.TF_WORKING_DIR }}/entraid_catalog_packages.json" \
            --discovered-summary "${{ env.TF_WORKING_DIR }}/discovered_summary.md" \
            --plan-output "${{ env.TF_WORKING_DIR }}/plan_output.txt" \
            --output-file "${{ env.TF_WORKING_DIR }}/plan_summary.md"

      - name: Publier le commentaire d'impact sur la PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let planOutput = '';
            try {
              planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            } catch (e) {
              planOutput = 'Sortie du plan indisponible.';
            }

            let summaryContent = '';
            try {
              summaryContent = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_summary.md', 'utf8');
            } catch (e) {
              summaryContent = '⚠️ Résumé non disponible.';
            }

            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            let status, emoji;

            let footerBlock = [];
            if (exitCode === '1') {
              status = 'Échec du contrôle SSoT — Ressources manquantes dans Entra ID';
              emoji = '❌';

              const missingApps = [];
              const appMatches = planOutput.matchAll(/No service principals found matching filter: "displayName eq '([^']+)'"/g);
              for (const m of appMatches) { missingApps.push(m[1]); }

              const missingGroups = [];
              const grpMatches = planOutput.matchAll(/No group found with display_name "([^"]+)"/g);
              for (const m of grpMatches) { missingGroups.push(m[1]); }

              footerBlock = [
                '> [!CAUTION]',
                '> ### 🚫 Ressources bloquantes à créer dans Entra ID :',
                '> **Certaines ressources (groupes, rôles applicatifs ou applications) déclarées dans votre fichier YAML n\'existent pas dans Microsoft Entra ID.**',
                '>',
                '> 💡 **Procédure de déblocage (Sans recréer d\'Issue) :**',
                '> 1. Créez les ressources manquantes directement dans le portail Microsoft Entra ID.',
                '> 2. Cliquez sur le bouton **"Re-run jobs"** de cette Pull Request pour relancer immédiatement la vérification.',
              ];

              if (missingApps.length > 0 || missingGroups.length > 0) {
                footerBlock.push('>');
                footerBlock.push('> **Détail des ressources manquantes détectées :**');
                for (const a of missingApps) { footerBlock.push(`> - 📱 Application / Rôle applicatif manquant : \`${a}\``); }
                for (const g of missingGroups) { footerBlock.push(`> - 👥 Groupe Entra ID manquant : \`${g}\``); }
              }
            } else {
              status = 'Ressources validées — Plan prêt pour approbation';
              emoji = '✅';
              footerBlock = [
                '> [!NOTE]',
                '> ### ℹ️ Étape suivante : Validation Humaine',
                '> Toutes les ressources cibles existent dans Entra ID. Un administrateur habilité doit examiner ce plan et apposer son approbation (**Approve**) avant de procéder au merge.'
              ];
            }

            const maxLen = 40000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n\n... (plan tronqué)'
              : planOutput;

            const body = [
              `## ${emoji} Étape 2 : Contrôle des Ressources — ${status}`,
              '',
              summaryContent,
              '',
              '---',
              '',
              '<details>',
              '<summary>🔍 Afficher le détail technique du plan Terraform</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '</details>',
              '',
              footerBlock.join('\n')
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Bloquer la CI en cas de ressource manquante
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "❌ Échec bloquant : des ressources manquent dans Entra ID."
          echo "👉 Veuillez créer la ressource dans Entra ID puis cliquer sur 'Re-run jobs'."
          exit 1

  # ===========================================================================
  # ÉTAPE 3 : Validation Humaine (Approbation Admin Requise)
  # ===========================================================================
  human-approval:
    name: "🛡️ Étape 3 : Validation Humaine (Approbation)"
    runs-on: ubuntu-latest
    needs: [validate-schema, detect-resources-and-plan]
    steps:
      - name: Contrôle du sas d'approbation
        uses: actions/github-script@v7
        with:
          script: |
            console.log('✅ Étapes 1 et 2 validées avec succès.');
            console.log('Attente de la validation humaine (Approve sur la Pull Request) par un administrateur habilité avant merge.');