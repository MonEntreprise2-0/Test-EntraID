# ============================================================================
# Workflow : CI — Pipeline de Validation à 3 Étapes (100% PowerShell)
# ============================================================================
# Étape 1 : Syntaxe et conformité (Schéma YAML v2, nommage 1 app = 1 dossier)
# Étape 2 : Contrôle SSoT Entra ID & Calcul du Plan (Bloquant, relance via Re-run)
# Étape 3 : Validation Humaine (Approbation Admin requise)
# ============================================================================
name: "🔍 CI — Pipeline de Validation à 3 Étapes"

on:
  pull_request:
    branches: [main]
    paths:
      - 'declaration/**'
      - 'modules/**'
      - 'scripts/**'
      - 'schemas/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:

  # ===========================================================================
  # ÉTAPE 1 : Syntaxe et Conformité
  # ===========================================================================
  validate-schema:
    name: "📋 Étape 1 : Syntaxe & Conformité"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détecter les fichiers YAML modifiés
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'declaration/**/*.yaml' | grep -v 'declaration/_' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "Aucun fichier déclaratif modifié."
            echo "files=" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "Fichiers déclaratifs modifiés :"
            echo "$CHANGED_FILES"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "files<<$EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
            echo "count=$(echo \"$CHANGED_FILES\" | wc -l)" >> $GITHUB_OUTPUT
          fi

      - name: Valider la syntaxe et la structure des déclarations YAML
        if: steps.changed.outputs.count != '0'
        shell: pwsh
        run: |
          $rawFiles = @"
          ${{ steps.changed.outputs.files }}
          "@
          $fileList = $rawFiles -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          & ./scripts/Tester-Declarations.ps1 -Stage SchemaOnly -ChangedFiles $fileList

  # ===========================================================================
  # ÉTAPE 2 : Détection des Ressources Entra ID (SSoT) & Calcul du Plan
  # ===========================================================================
  detect-resources-and-plan:
    name: "🔎 Étape 2 : Détection des Ressources Entra ID"
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Détecter les fichiers déclaratifs modifiés
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'declaration/**/*.yaml' | grep -v 'declaration/_' || true)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "files<<$EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Contrôle SSoT Entra ID et Calcul du Plan
        id: plan
        shell: pwsh
        run: |
          $rawFiles = @"
          ${{ steps.changed.outputs.files }}
          "@
          $fileList = $rawFiles -split "`r?`n" | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $planExit = 0
          try {
            & ./scripts/Tester-Declarations.ps1 -Stage SSoTAndPlan -ChangedFiles $fileList -OutputPlanFile plan_summary.md
          } catch {
            $planExit = 1
          }

          if ($LASTEXITCODE -ne 0) { $planExit = $LASTEXITCODE }
          echo "exit_code=$planExit" >> $env:GITHUB_OUTPUT
          exit $planExit

      - name: Publier le commentaire de plan sur la PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summaryContent = '';
            try {
              if (fs.existsSync('plan_summary.md')) {
                summaryContent = fs.readFileSync('plan_summary.md', 'utf8');
              } else {
                summaryContent = '⚠️ Rapport du plan indisponible.';
              }
            } catch (e) {
              summaryContent = '⚠️ Erreur lors de la lecture du rapport : ' + e.message;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: summaryContent
            });

      - name: Bloquer la CI en cas de ressource manquante dans Entra ID
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "❌ Échec bloquant : des ressources manquent dans Microsoft Entra ID."
          echo "👉 Veuillez créer la ressource dans Entra ID puis cliquer sur 'Re-run jobs'."
          exit 1

  # ===========================================================================
  # ÉTAPE 3 : Validation Humaine (Approbation Admin Requise)
  # ===========================================================================
  human-approval:
    name: "🛡️ Étape 3 : Validation Humaine (Approbation)"
    runs-on: ubuntu-latest
    needs: [validate-schema, detect-resources-and-plan]
    steps:
      - name: Contrôle du sas d'approbation
        uses: actions/github-script@v7
        with:
          script: |
            console.log('✅ Étapes 1 et 2 validées avec succès.');
            console.log('Attente de la validation humaine (Approve sur la Pull Request) par un administrateur habilité avant merge.');