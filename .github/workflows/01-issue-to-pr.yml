# ============================================================================
# Workflow : Issue -> Pull Request (Création, Modification, Suppression)
# ============================================================================
name: "🔄 Issue → Pull Request"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-issue:
    name: "📝 Traiter l'Issue"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'entitlement-request')

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Parse Issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/parse-issue-body.py \
            --body "$ISSUE_BODY" \
            --output-dir ./parsed

          APP_NAME=$(cat ./parsed/app_name.txt)
          OPERATION=$(cat ./parsed/operation_type.txt)

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "operation=$OPERATION" >> $GITHUB_OUTPUT

      - name: Determine branch name
        id: branch
        run: |
          APP_NAME="${{ steps.parse.outputs.app_name }}"
          OPERATION="${{ steps.parse.outputs.operation }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH="entitlement/${OPERATION}-${APP_NAME}-${TIMESTAMP}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create branch and apply Git changes
        run: |
          APP_NAME="${{ steps.parse.outputs.app_name }}"
          OPERATION="${{ steps.parse.outputs.operation }}"
          BRANCH="${{ steps.branch.outputs.name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          if [ "$OPERATION" = "suppression" ]; then
            TARGET_FILE="declarations/apps/${APP_NAME}.yaml"
            if [ -f "$TARGET_FILE" ]; then
              git rm "$TARGET_FILE"
              git commit -m "feat(entitlement): suppression de ${APP_NAME} — via Issue #${{ github.event.issue.number }}"
            else
              echo "⚠️ Fichier ${TARGET_FILE} introuvable pour suppression."
              exit 1
            fi
          else
            cp ./parsed/app.yaml "declarations/apps/${APP_NAME}.yaml"
            git add "declarations/apps/${APP_NAME}.yaml"
            git commit -m "feat(entitlement): ${OPERATION} de ${APP_NAME} — via Issue #${{ github.event.issue.number }}"
          fi

          git push origin "$BRANCH"

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v7
        env:
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          OPERATION: ${{ steps.parse.outputs.operation }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        with:
          script: |
            const appName = process.env.APP_NAME;
            const operation = process.env.OPERATION;
            const branch = process.env.BRANCH;
            const issueNumber = process.env.ISSUE_NUM;

            let operationTitle = '';
            let operationDesc = '';
            switch (operation) {
              case 'suppression':
                operationTitle = '🗑️ Suppression';
                operationDesc = `⚠️ Cette Pull Request **supprime** le fichier déclaratif de l'application \`${appName}\`.\nLors du merge sur \`main\`, Terraform supprimera automatiquement le catalogue, les Access Packages et les politiques associées dans **Entra ID**.`;
                break;
              case 'modification':
                operationTitle = '✏️ Modification';
                operationDesc = `Cette Pull Request met à jour la configuration déclarative de l'application \`${appName}\`.`;
                break;
              default:
                operationTitle = '🆕 Création';
                operationDesc = `Cette Pull Request déclare la nouvelle application \`${appName}\` dans le référentiel.`;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Entitlement] ${appName} — ${operationTitle}`,
              head: branch,
              base: 'main',
              body: [
                `## 📦 Entitlement Management — ${appName}`,
                '',
                `**Opération** : ${operationTitle}`,
                `**Issue source** : #${issueNumber}`,
                `**Fichier** : \`declarations/apps/${appName}.yaml\``,
                '',
                operationDesc,
                '',
                '---',
                '',
                '### ✅ Checklist de validation automatique',
                '',
                '- [ ] Validation JSON Schema',
                '- [ ] Terraform Plan (contrôle SSoT Entra ID)',
                '',
                '### 👥 Approbations requises',
                '',
                '- [ ] Data Owner / Métier',
                '- [ ] Équipe IAM',
                '',
                '---',
                `> 🤖 PR créée automatiquement à partir de l'Issue #${issueNumber}`,
              ].join('\n'),
            });

            core.setOutput('pr_number', pr.data.number);
            core.setOutput('pr_url', pr.data.html_url);

      - name: Comment on Issue and close
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          OPERATION: ${{ steps.parse.outputs.operation }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const prUrl = process.env.PR_URL;
            const appName = process.env.APP_NAME;
            const operation = process.env.OPERATION;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ✅ Demande prise en charge avec succès',
                '',
                `La Pull Request **#${prNumber}** a été créée automatiquement :`,
                `👉 ${prUrl}`,
                '',
                '**Prochaines étapes** :',
                '1. La CI valide le schéma et calcule le plan d\'impact Terraform',
                '2. Le résumé prévisionnel des actions dans Entra ID est notifié dans la PR',
                '3. Après approbation et merge sur `main`, les changements sont appliqués automatiquement à Entra ID',
                '',
                `> 📄 Application : \`${appName}\` (${operation})`,
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Erreur lors du traitement de votre demande',
                '',
                'Une erreur s\'est produite lors de l\'analyse du formulaire ou de la création de la Pull Request.',
                `Consultez les [logs du workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) pour plus de détails.`,
                '',
                '**Vérifications conseillées** :',
                '- Assurez-vous d\'avoir bien glissé-déposé un fichier `.yaml` valide',
                '- Vérifiez que le nom de l\'application correspond à celui dans le fichier YAML',
              ].join('\n'),
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['error'],
            });