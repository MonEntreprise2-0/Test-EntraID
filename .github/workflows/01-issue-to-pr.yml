# ============================================================================
# Workflow : Issue -> Pull Request (Routage des 4 Scénarios - 100% PowerShell)
# ============================================================================
name: "🔄 Issue → Pull Request"

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  route-and-process-issue:
    name: "📝 Traiter et Router l'Issue"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'entitlement-request') && github.event.issue.state != 'closed'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 1. Parsing du formulaire d'Issue (PowerShell)
      - name: Parse Issue body
        id: parse
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          & ./scripts/Traiter-DemandeIssue.ps1 `
            -IssueBody $env:ISSUE_BODY `
            -IssueTitle $env:ISSUE_TITLE `
            -IssueLabels $env:ISSUE_LABELS `
            -OutputDir ./parsed

          $operation = (Get-Content ./parsed/operation_type.txt -Raw).Trim()
          echo "operation=$operation" >> $env:GITHUB_OUTPUT

          if (Test-Path ./parsed/app_name.txt) {
            $appName = (Get-Content ./parsed/app_name.txt -Raw).Trim()
            echo "app_name=$appName" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path ./parsed/github_team.txt) {
            $team = (Get-Content ./parsed/github_team.txt -Raw).Trim()
            echo "github_team=$team" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path ./parsed/zip_url.txt) {
            $zipUrl = (Get-Content ./parsed/zip_url.txt -Raw).Trim()
            echo "zip_url=$zipUrl" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path ./parsed/target_applications.txt) {
            $targets = (Get-Content ./parsed/target_applications.txt -Raw).Trim()
            echo "target_applications=$targets" >> $env:GITHUB_OUTPUT
          }

      # -----------------------------------------------------------------------
      # 1.1 Contrôle de la validité de l'interprétation de l'Issue
      # -----------------------------------------------------------------------
      - name: Vérifier la détection du scénario
        if: steps.parse.outputs.operation == 'unknown'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ **Erreur d'interprétation de la demande** : Le système n'a pas pu identifier le scénario correspondant à cette Issue.\n\nVeuillez vous assurer d'utiliser l'un des formulaires officiels du dépôt.`
            });
            core.setFailed('Scénario inconnu (unknown).');

      # -----------------------------------------------------------------------
      # 2. Contrôle d'Accès & Habilitations (RBAC & CODEOWNERS) et Vérification des Équipes
      # -----------------------------------------------------------------------
      - name: Vérifier les habilitations (RBAC & CODEOWNERS) et l'existence des équipes
        id: auth
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ steps.parse.outputs.operation }}
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          GITHUB_TEAM: ${{ steps.parse.outputs.github_team }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const author = context.payload.issue.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const op = process.env.OPERATION;
            const rawAppName = (process.env.APP_NAME || '').trim();
            const teamInput = (process.env.GITHUB_TEAM || '').trim();

            // 1. Détermination du statut Administrateur du dépôt
            let isRepoAdmin = false;
            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: owner,
                repo: repo,
                username: author,
              });
              const level = perm.data.permission;
              isRepoAdmin = (level === 'admin' || level === 'write');
            } catch (e) {
              console.log('Erreur permission repo:', e.message);
            }

            // 2. Contrôle pour les scénarios réservés aux Administrateurs (B, C, D)
            if (op === 'admin_create' || op === 'admin_bulk' || op === 'admin_import') {
              if (!isRepoAdmin) {
                const actionLabel = (op === 'admin_create') ? "créer une nouvelle application" :
                                    (op === 'admin_bulk') ? "exécuter une modification de masse" :
                                    "importer des applications depuis Microsoft Entra ID";
                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  body: `⛔ **Accès refusé** : Vous n'êtes pas autorisé à ${actionLabel}.\n\nCette opération est strictement réservée aux administrateurs IAM.\nVeuillez contacter un administrateur IAM pour cette demande.`
                });
                await github.rest.issues.update({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed'
                });
                core.setFailed(`Utilisateur non-admin (@${author}) sur ${op}`);
                return;
              }
            }

            // 3. Contrôle de l'existence de la Team pour le Scénario B (Création)
            if (op === 'admin_create') {
              if (!teamInput) {
                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  body: `❌ **Erreur bloquante** : Aucune Team GitHub Owner n'a été spécifiée dans le formulaire.`
                });
                await github.rest.issues.update({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed'
                });
                core.setFailed('Team GitHub manquante pour la création.');
                return;
              }

              let matchedTeam = null;
              try {
                const teamsRes = await github.rest.teams.list({ org: owner, per_page: 100 });
                matchedTeam = teamsRes.data.find(t => 
                  t.slug.toLowerCase() === teamInput.toLowerCase() || 
                  t.name.toLowerCase() === teamInput.toLowerCase()
                );
              } catch (e) {
                console.log('Erreur requête teams:', e.message);
              }

              if (!matchedTeam) {
                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  body: `❌ **Erreur bloquante** : L'équipe GitHub \`${teamInput}\` est introuvable dans l'organisation \`${owner}\`.\n\nVeuillez vérifier l'orthographe exacte de l'équipe sur [Teams ${owner}](https://github.com/orgs/${owner}/teams).\nL'Issue est automatiquement clôturée.`
                });
                await github.rest.issues.update({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed'
                });
                core.setFailed(`Team ${teamInput} introuvable dans l'organisation.`);
                return;
              }
              core.setOutput('team_slug', matchedTeam.slug);
            }

            // 4. Contrôle de l'existence de TOUTES les Teams pour le Scénario D (Import)
            if (op === 'admin_import') {
              let teamsToCheck = [];
              if (fs.existsSync('./parsed/teams_to_validate.txt')) {
                teamsToCheck = fs.readFileSync('./parsed/teams_to_validate.txt', 'utf8')
                  .split(/\r?\n/)
                  .map(t => t.trim())
                  .filter(t => t.length > 0 && t.toLowerCase() !== 'admins');
              }

              if (teamsToCheck.length > 0) {
                let orgTeams = [];
                try {
                  const teamsRes = await github.rest.teams.list({ org: owner, per_page: 100 });
                  orgTeams = teamsRes.data;
                } catch (e) {
                  console.log('Erreur requête teams org:', e.message);
                }

                const missingTeams = [];
                for (const reqTeam of teamsToCheck) {
                  const found = orgTeams.some(t => 
                    t.slug.toLowerCase() === reqTeam.toLowerCase() || 
                    t.name.toLowerCase() === reqTeam.toLowerCase()
                  );
                  if (!found) {
                    missingTeams.push(reqTeam);
                  }
                }

                if (missingTeams.length > 0) {
                  const missingStr = missingTeams.map(t => `\`${t}\``).join(', ');
                  await github.rest.issues.createComment({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.issue.number,
                    body: `❌ **Erreur bloquante** : L'équipe GitHub ${missingStr} est introuvable dans l'organisation \`${owner}\`.\n\nVeuillez vérifier l'orthographe exacte des équipes sur [Teams ${owner}](https://github.com/orgs/${owner}/teams).\nL'Issue est automatiquement clôturée.`
                  });
                  await github.rest.issues.update({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.issue.number,
                    state: 'closed'
                  });
                  core.setFailed(`Équipes introuvables : ${missingStr}`);
                  return;
                }
              }
            }

            // 5. Contrôle d'habilitation CODEOWNERS pour le Scénario A (Modification)
            if (op === 'user_modify') {
              if (!rawAppName) {
                await github.rest.issues.createComment({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  body: `❌ **Erreur bloquante** : Aucun nom d'application (\`app_name\`) n'a pu être extrait du formulaire ou du fichier YAML.`
                });
                await github.rest.issues.update({
                  owner: owner,
                  repo: repo,
                  issue_number: context.payload.issue.number,
                  state: 'closed'
                });
                core.setFailed('app_name manquant.');
                return;
              }

              const removeAccents = (str) => (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
              const cleanName = removeAccents(rawAppName.replace(/^cat-/i, '').trim().toLowerCase());
              const normClean = cleanName.replace(/[\s_]+/g, '-').replace(/-+/g, '-');

              // Identification du dossier cible existant
              let targetDir = null;
              try {
                const entries = fs.readdirSync('declaration');
                for (const entry of entries) {
                  if (entry.startsWith('_')) continue;
                  const fullPath = path.join('declaration', entry);
                  if (!fs.statSync(fullPath).isDirectory()) continue;
                  const entryClean = removeAccents(entry.replace(/^cat-/i, '').trim().toLowerCase());
                  const normEntry = entryClean.replace(/[\s_]+/g, '-').replace(/-+/g, '-');
                  if (entryClean === cleanName || (normClean.length > 0 && normClean === normEntry)) {
                    targetDir = entry;
                    break;
                  }
                }
              } catch (e) {
                console.log('Erreur lecture declaration/:', e.message);
              }
              if (targetDir) {
                core.setOutput('target_dir', targetDir);
              }

              if (isRepoAdmin) {
                console.log(`✅ L'utilisateur @${author} est administrateur du dépôt. Modification autorisée.`);
              } else {
                // Recherche des propriétaires dans .github/CODEOWNERS
                let codeownersText = '';
                if (fs.existsSync('.github/CODEOWNERS')) {
                  codeownersText = fs.readFileSync('.github/CODEOWNERS', 'utf8');
                }

                const lines = codeownersText.split(/\r?\n/);
                let matchedRule = null;
                let fallbackDeclarationRule = null;

                for (const line of lines) {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith('#')) continue;

                  if (trimmed.startsWith('/declaration/')) {
                    const parts = trimmed.split(/\s+/);
                    const pathPattern = parts[0];
                    const owners = parts.slice(1);

                    if (pathPattern === '/declaration/') {
                      fallbackDeclarationRule = owners;
                    } else {
                      const dirMatch = pathPattern.match(/^\/declaration\/([^/]+)\/?$/i);
                      if (dirMatch) {
                        const dirName = removeAccents(dirMatch[1].replace(/^cat-/i, '').trim().toLowerCase());
                        const normDir = dirName.replace(/[^a-zA-Z0-9]/g, '');
                        if (dirName === cleanName || (normClean.length > 0 && normClean === normDir)) {
                          matchedRule = owners;
                        }
                      }
                    }
                  }
                }

                const effectiveOwners = matchedRule || fallbackDeclarationRule || [];
                console.log(`Propriétaires identifiés pour ${rawAppName} :`, effectiveOwners);

                let isOwnerMember = false;
                for (const ownerToken of effectiveOwners) {
                  if (ownerToken.startsWith('@')) {
                    const handle = ownerToken.substring(1);
                    if (handle.includes('/')) {
                      const [teamOrg, teamSlug] = handle.split('/');
                      try {
                        const memRes = await github.rest.teams.getMembershipForUserInOrg({
                          org: teamOrg,
                          team_slug: teamSlug,
                          username: author,
                        });
                        if (memRes.data && memRes.data.state === 'active') {
                          isOwnerMember = true;
                          console.log(`✅ L'utilisateur @${author} est membre actif de l'équipe @${handle}.`);
                          break;
                        }
                      } catch (e) {
                        // Non-membre (404/403)
                      }
                    } else {
                      if (handle.toLowerCase() === author.toLowerCase()) {
                        isOwnerMember = true;
                        break;
                      }
                    }
                  }
                }

                if (!isOwnerMember) {
                  const ownersDisplay = (effectiveOwners.length > 0) ? effectiveOwners.join(' ') : '`@admins`';
                  await github.rest.issues.createComment({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.issue.number,
                    body: `⛔ **Accès refusé** : Vous n'êtes pas autorisé à modifier l'application \`${rawAppName}\`.\n\nSelon le fichier de gouvernance \`.github/CODEOWNERS\`, cette application est gérée par : ${ownersDisplay}.\n\nVeuillez contacter un administrateur IAM ou un membre de cette équipe pour effectuer cette modification.`
                  });
                  await github.rest.issues.update({
                    owner: owner,
                    repo: repo,
                    issue_number: context.payload.issue.number,
                    state: 'closed'
                  });
                  core.setFailed(`Utilisateur @${author} non habilité sur l'application ${rawAppName}.`);
                  return;
                }
              }
            }

      # -----------------------------------------------------------------------
      # 5. Traitement Scénario C : Décompression du ZIP de masse (PowerShell)
      # -----------------------------------------------------------------------
      - name: "[Scénario C] Télécharger et traiter l'archive ZIP"
        if: steps.parse.outputs.operation == 'admin_bulk'
        shell: pwsh
        env:
          ZIP_URL: ${{ steps.parse.outputs.zip_url }}
        run: |
          if (-not $env:ZIP_URL) {
            Write-Error "❌ Aucune URL d'archive ZIP détectée dans l'Issue."
            exit 1
          }

          Write-Host "📥 Téléchargement de l'archive ZIP : $env:ZIP_URL"
          Invoke-WebRequest -Uri $env:ZIP_URL -OutFile "bulk_update.zip"

          $extractDir = "./temp_extract"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          Expand-Archive -Path "bulk_update.zip" -DestinationPath $extractDir -Force

          # Importer le module de validation syntaxique si disponible
          if (Test-Path "./modules/ValidationSyntaxe/ValidationSyntaxe.psd1") {
            Import-Module "./modules/ValidationSyntaxe/ValidationSyntaxe.psd1" -Force
          }

          # Détecter tous les fichiers déclaratifs (.yaml / .yml) dans l'archive
          $yamlFiles = Get-ChildItem -Path $extractDir -Recurse -File | Where-Object { $_.Extension -in @('.yaml', '.yml') }
          $modified = [System.Collections.Generic.List[string]]::new()

          # Récupérer les dossiers existants dans declaration/ pour faire correspondre le nom exact
          $existingDirs = if (Test-Path "declaration") {
            Get-ChildItem -Path "declaration" -Directory | Where-Object { -not $_.Name.StartsWith('_') }
          } else {
            @()
          }

          foreach ($f in $yamlFiles) {
            $rawAppName = $null

            # 1. Extraction d'app_name via Lire-DeclarationYaml
            try {
              if (Get-Command -Name "Lire-DeclarationYaml" -ErrorAction SilentlyContinue) {
                $doc = Lire-DeclarationYaml -Path $f.FullName -ErrorAction Stop
                if ($doc -and -not [string]::IsNullOrWhiteSpace($doc.app_name)) {
                  $rawAppName = $doc.app_name.Trim()
                }
              }
            } catch {
              Write-Verbose "Échec lecture structurée : $_"
            }

            # 2. Fallback regex sur app_name
            if ([string]::IsNullOrWhiteSpace($rawAppName)) {
              $fileContent = Get-Content -Path $f.FullName -Raw -Encoding UTF8
              if ($fileContent -match '(?m)^\s*app_name\s*:\s*["'']?([^"''\r\n#]+)') {
                $rawAppName = $Matches[1].Trim()
              }
            }

            # 3. Fallback ultime sur le nom de fichier si aucun app_name présent
            if ([string]::IsNullOrWhiteSpace($rawAppName)) {
              Write-Warning "⚠️ Aucun champ 'app_name' trouvé dans '$($f.Name)', utilisation du nom de fichier."
              $rawAppName = $f.BaseName
            }

            $cleanAppName = $rawAppName -replace '^(?i)CAT-', ''
            $normClean = ($cleanAppName -replace '[^a-zA-Z0-9]', '').ToLowerInvariant()

            # 4. Recherche de correspondance avec un dossier existant dans declaration/
            $matchedDir = $null
            foreach ($d in $existingDirs) {
              $entryClean = $d.Name -replace '^(?i)CAT-', ''
              $normEntry = ($entryClean -replace '[^a-zA-Z0-9]', '').ToLowerInvariant()
              if ($d.Name.Equals("CAT-$cleanAppName", [System.StringComparison]::OrdinalIgnoreCase) -or
                  $d.Name.Equals($rawAppName, [System.StringComparison]::OrdinalIgnoreCase) -or
                  $entryClean.Equals($cleanAppName, [System.StringComparison]::OrdinalIgnoreCase) -or
                  ($normClean.Length -gt 0 -and $normEntry -eq $normClean)) {
                $matchedDir = $d.Name
                break
              }
            }

            # Dossier et fichier cibles : CAT-{app_name}
            $targetCatName = if ($matchedDir) { $matchedDir } else { "CAT-$cleanAppName" }
            $targetDir = "declaration/$targetCatName"
            if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            }

            $targetFile = "$targetDir/$targetCatName.yaml"
            Copy-Item -Path $f.FullName -Destination $targetFile -Force
            if (-not $modified.Contains($targetCatName)) {
              $modified.Add($targetCatName)
            }
            Write-Host "✅ Application '$targetCatName' (app_name: '$rawAppName') identifiée et copiée vers '$targetFile' (depuis '$($f.Name)')." -ForegroundColor Green
          }

          New-Item -ItemType Directory -Path "./parsed" -Force | Out-Null
          [System.IO.File]::WriteAllLines("./parsed/modified_apps.txt", $modified.ToArray(), [System.Text.Encoding]::UTF8)

      # -----------------------------------------------------------------------
      # 6. Traitement Scénario D : Aspiration Entra ID (Reverse Engineering)
      # -----------------------------------------------------------------------
      - name: "[Scénario D] Azure Login (OIDC) & Extraction Graph API"
        if: steps.parse.outputs.operation == 'admin_import'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "[Scénario D] Exécuter le Reverse Engineering (PowerShell)"
        id: reverse-engineer
        if: steps.parse.outputs.operation == 'admin_import'
        shell: pwsh
        env:
          TARGET_APPS: ${{ steps.parse.outputs.target_applications }}
        run: |
          if (-not $env:TARGET_APPS -or [string]::IsNullOrWhiteSpace($env:TARGET_APPS)) {
            $err = "Aucun catalogue à importer n'a pu être extrait du formulaire de l'Issue. Veuillez renseigner le champ 'Noms exacts des catalogues à importer (CAT-{app_name})'."
            New-Item -ItemType Directory -Path "./parsed" -Force | Out-Null
            [System.IO.File]::WriteAllText("./parsed/import_errors.txt", $err, [System.Text.Encoding]::UTF8)
            Write-Error $err
            exit 1
          }
          & ./scripts/Importer-DepuisEntra.ps1 `
            -Applications $env:TARGET_APPS `
            -DeclarationDir "declaration" `
            -OutputList "./parsed/imported_apps.txt" `
            -ErrorFile "./parsed/import_errors.txt" `
            -SummaryFile "./parsed/import_summary.md"

      - name: "[Scénario D] Notification d'échec d'import sur l'Issue"
        if: steps.parse.outputs.operation == 'admin_import' && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let errorDetails = "Une erreur technique inattendue est survenue lors de l'extraction depuis Microsoft Entra ID.";
            if (fs.existsSync('./parsed/import_errors.txt')) {
              const content = fs.readFileSync('./parsed/import_errors.txt', 'utf8').trim();
              if (content) {
                errorDetails = content;
              }
            }
            const issueNum = context.payload.issue.number;
            const isNomenclature = errorDetails.toLowerCase().includes('nomenclature');
            const note = isNomenclature
              ? `\n\n---\n> ℹ️ **Règle de nomenclature obligatoire :**\n> Le catalogue doit obligatoirement être nommé \`CAT-{app_name}\` dans Entra ID.\n> Chaque Access Package doit impérativement respecter la convention : \`{app_name} - [Contexte] [Privilège] - [Environnement]\` *(ou \`{app_name} - [Privilège] - [Environnement]\`)* avec un environnement parmi DEV, UAT, PRD, TST, GLB.\n> Si **un seul Access Package** ne respecte pas cette règle, l'import du catalogue en entier est rejeté.\n>\n> 👉 **Pour corriger :** Ajustez le nom directement dans le portail Microsoft Entra ID, puis relancez l'import.`
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: `❌ **Échec de l'importation depuis Microsoft Entra ID**\n\n\`\`\`text\n${errorDetails}\n\`\`\`${note}`
            });

      # -----------------------------------------------------------------------
      # 7. Création de la Branche Git & Commit des fichiers
      # -----------------------------------------------------------------------
      - name: Déterminer le nom de branche
        id: branch
        run: |
          OP="${{ steps.parse.outputs.operation }}"
          APP="${{ steps.parse.outputs.app_name }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          APP_SLUG=$(echo "$APP" | sed 'y/éèêëàâäîïôöùûüçÉÈÊËÀÂÄÎÏÔÖÙÛÜÇ/eeeeaaaiioouuucEEEEAAAIIOOUUUC/' | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-_')
          [ -z "$APP_SLUG" ] && APP_SLUG="app"

          case "$OP" in
            user_modify)  BRANCH="entitlement/modify-${APP_SLUG}-${TIMESTAMP}" ;;
            admin_create) BRANCH="admin/create-${APP_SLUG}-${TIMESTAMP}" ;;
            admin_bulk)   BRANCH="admin/bulk-${TIMESTAMP}" ;;
            admin_import) BRANCH="admin/import-entra-${TIMESTAMP}" ;;
            *)            BRANCH="entitlement/change-${TIMESTAMP}" ;;
          esac

          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          echo "app_slug=$APP_SLUG" >> $GITHUB_OUTPUT

      - name: Appliquer les modifications Git et pusher la branche
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          OP="${{ steps.parse.outputs.operation }}"
          APP_SLUG="${{ steps.branch.outputs.app_slug }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          if [ "$OP" = "user_modify" ] || [ "$OP" = "admin_create" ]; then
            if [ ! -f "./parsed/app.yaml" ]; then
              echo "::error::Fichier ./parsed/app.yaml introuvable !"
              exit 1
            fi
            TARGET_DIR="${{ steps.auth.outputs.target_dir }}"
            if [ "$OP" = "user_modify" ] && [ -n "$TARGET_DIR" ]; then
              CAT_DIR="$TARGET_DIR"
            else
              CLEAN_SLUG=$(echo "$APP_SLUG" | sed -e 's/^cat-//I')
              CAT_DIR="CAT-${CLEAN_SLUG}"
            fi
            mkdir -p "declaration/${CAT_DIR}"
            cp ./parsed/app.yaml "declaration/${CAT_DIR}/${CAT_DIR}.yaml"
            git add "declaration/${CAT_DIR}/${CAT_DIR}.yaml"
            git commit --allow-empty -m "feat(entitlement): [${OP}] ${CAT_DIR} — via Issue #${{ github.event.issue.number }}"
          elif [ "$OP" = "admin_bulk" ] || [ "$OP" = "admin_import" ]; then
            git add declaration/
            git commit --allow-empty -m "feat(entitlement): [${OP}] mise à jour déclarative — via Issue #${{ github.event.issue.number }}"
          fi

          git push origin "$BRANCH"

      # -----------------------------------------------------------------------
      # 8. Ouverture de la Pull Request Consolidée
      # -----------------------------------------------------------------------
      - name: Créer la Pull Request
        id: create-pr
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ steps.parse.outputs.operation }}
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          GITHUB_TEAM: ${{ steps.auth.outputs.team_slug }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const op = process.env.OPERATION;
            const app = process.env.APP_NAME || '';
            const team = process.env.GITHUB_TEAM || '';
            const branch = process.env.BRANCH;
            const issueNum = process.env.ISSUE_NUM;

            try {
              const existingPrs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 30
              });
              const duplicate = existingPrs.data.find(p =>
                p.title.includes(`(Issue #${issueNum})`) ||
                (p.body && p.body.includes(`Closes #${issueNum}`))
              );
              if (duplicate) {
                console.log(`⚠️ Une PR (#${duplicate.number}) existe déjà pour l'Issue #${issueNum}. Fin du workflow.`);
                return;
              }
            } catch (err) {
              console.log('Vérification doublons ignorée:', err.message);
            }

            let title = '';
            let desc = '';

            const opTag = `<!-- OPERATION: ${op} -->\n`;
            if (op === 'user_modify') {
              title = `✏️ [Modification] ${app} (Issue #${issueNum})`;
              desc = `${opTag}Modification de l'application déclarative **${app}** soumise via l'Issue #${issueNum}.`;
            } else if (op === 'admin_create') {
              title = `🆕 [Création Admin] ${app} (Issue #${issueNum})`;
              desc = `${opTag}Création de la nouvelle application **${app}**.\n\n<!-- GITHUB_TEAM: ${team} -->\n**Team GitHub Owner assignée :** \`@${context.repo.owner}/${team}\` (sera enregistrée dans \`CODEOWNERS\` avec les admins lors du merge).`;
            } else if (op === 'admin_bulk') {
              title = `⚡ [Masse Admin] Modification groupée (Issue #${issueNum})`;
              desc = `${opTag}Modification en masse de plusieurs fichiers YAML via archive ZIP (Issue #${issueNum}).`;
            } else if (op === 'admin_import') {
              title = `🔄 [Import Entra ID] Reverse Engineering (Issue #${issueNum})`;
              const fs = require('fs');
              let summaryMd = '';
              if (fs.existsSync('./parsed/import_summary.md')) {
                summaryMd = fs.readFileSync('./parsed/import_summary.md', 'utf8').trim();
              }
              let teamsMapTag = '';
              if (fs.existsSync('./parsed/catalog_teams_map.txt')) {
                const mapRaw = fs.readFileSync('./parsed/catalog_teams_map.txt', 'utf8').trim();
                if (mapRaw) {
                  const singleMap = mapRaw.split(/\r?\n/).filter(l => l.includes('=')).join(';');
                  teamsMapTag = `\n\n<!-- GITHUB_TEAMS_MAP: ${singleMap} -->`;
                }
              }
              desc = `${opTag}` + (summaryMd || `Import déclaratif d'applications depuis Microsoft Entra ID (Issue #${issueNum}).`) + teamsMapTag;
            }

            if (!title) {
              title = `🆕 [Demande Entitlement] ${app || 'Demande'} (Issue #${issueNum})`;
              desc = `Traitement automatique de la demande soumise via l'Issue #${issueNum}.`;
            }

            const isImportWithSummary = (op === 'admin_import' && (desc.startsWith('## 📋') || desc.includes('📋')));
            const body = isImportWithSummary
              ? [
                  desc,
                  '',
                  '---',
                  `Closes #${issueNum}`,
                  '',
                  '> ℹ️ Le pipeline CI va valider le schéma, inspecter les ressources dans Entra ID et calculer le plan de déploiement (100% PowerShell).'
                ].join('\n')
              : [
                  `## ${title}`,
                  '',
                  desc,
                  '',
                  '---',
                  `Closes #${issueNum}`,
                  '',
                  '> ℹ️ Le pipeline CI va valider le schéma, inspecter les ressources dans Entra ID et calculer le plan de déploiement (100% PowerShell).'
                ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: branch,
              base: 'main',
              body: body
            });

            const scenarioText = (op === 'user_modify') ? `modifier l'application **${app}** (propriétaire CODEOWNERS ou administrateur)` :
                                 (op === 'admin_create') ? `créer la nouvelle application **${app}** (administrateur IAM)` :
                                 (op === 'admin_bulk') ? `exécuter une modification en masse (administrateur IAM)` :
                                 `importer des applications depuis Microsoft Entra ID (administrateur IAM)`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: `✅ **Vous êtes autorisé à ${scenarioText}.**\n\n🚀 **Pull Request créée avec succès !**\nL'Issue est automatiquement clôturée et le traitement se poursuit sur la PR : [#${pr.data.number} (${title})](${pr.data.html_url})`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              state: 'closed',
              state_reason: 'completed'
            });