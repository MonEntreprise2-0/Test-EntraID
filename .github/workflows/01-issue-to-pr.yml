# ============================================================================
# Workflow : Issue -> Pull Request (Routage des 4 Scénarios)
# ============================================================================
name: "🔄 Issue → Pull Request"

on:
  issues:
    types: [opened, reopened]

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  route-and-process-issue:
    name: "📝 Traiter et Router l'Issue"
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'entitlement-request') && github.event.issue.state != 'closed'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # -----------------------------------------------------------------------
      # 1. Parsing du formulaire d'Issue
      # -----------------------------------------------------------------------
      - name: Parse Issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/parse-issue-body.py \
            --body "$ISSUE_BODY" \
            --output-dir ./parsed

          OPERATION=$(cat ./parsed/operation_type.txt)
          echo "operation=$OPERATION" >> $GITHUB_OUTPUT

          if [ -f ./parsed/app_name.txt ]; then
            APP_NAME=$(cat ./parsed/app_name.txt)
            echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          fi

          if [ -f ./parsed/github_team.txt ]; then
            GITHUB_TEAM=$(cat ./parsed/github_team.txt)
            echo "github_team=$GITHUB_TEAM" >> $GITHUB_OUTPUT
          fi

          if [ -f ./parsed/zip_url.txt ]; then
            ZIP_URL=$(cat ./parsed/zip_url.txt)
            echo "zip_url=$ZIP_URL" >> $GITHUB_OUTPUT
          fi

          if [ -f ./parsed/target_applications.txt ]; then
            TARGET_APPS=$(cat ./parsed/target_applications.txt)
            echo "target_applications=$TARGET_APPS" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # 2. Contrôle d'Accès RBAC pour les scénarios réservés aux Admins
      # -----------------------------------------------------------------------
      - name: Vérifier les privilèges d'administration
        id: rbac
        if: steps.parse.outputs.operation != 'user_modify'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let isAdmin = false;
            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: owner,
                repo: repo,
                username: author,
              });
              const level = perm.data.permission;
              isAdmin = (level === 'admin' || level === 'write');
            } catch (e) {
              console.log('Erreur permission repo:', e.message);
            }

            if (!isAdmin) {
              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: context.payload.issue.number,
                body: `⛔ **Accès refusé** : L'utilisateur @${author} n'est pas autorisé à exécuter ce scénario réservé aux administrateurs.\n\nL'Issue est automatiquement clôturée.`
              });
              await github.rest.issues.update({
                owner: owner,
                repo: repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              core.setFailed(`Utilisateur non-admin : ${author}`);
            }

      # -----------------------------------------------------------------------
      # 3. Traitement Scénario A : Modification d'application existante (User)
      # -----------------------------------------------------------------------
      - name: "[Scénario A] Valider existence préalable de l'application"
        if: steps.parse.outputs.operation == 'user_modify'
        uses: actions/github-script@v7
        env:
          APP_NAME: ${{ steps.parse.outputs.app_name }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const appName = process.env.APP_NAME.toLowerCase();
            const appDir = path.join('declaration', appName);

            if (!fs.existsSync(appDir)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Erreur bloquante** : L'application \`${appName}\` n'existe pas dans \`declaration/\`.\n\nLe formulaire utilisateur est strictement réservé à la **modification d'applications existantes**.\nPour créer une nouvelle application, veuillez contacter un administrateur IAM.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              core.setFailed(`L'application ${appName} n'existe pas.`);
            }

      # -----------------------------------------------------------------------
      # 4. Traitement Scénario B : Création d'application (Admin)
      # -----------------------------------------------------------------------
      - name: "[Scénario B] Valider absence d'application et existence de la Team"
        id: validate-team
        if: steps.parse.outputs.operation == 'admin_create'
        uses: actions/github-script@v7
        env:
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          GITHUB_TEAM: ${{ steps.parse.outputs.github_team }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const appName = process.env.APP_NAME.toLowerCase();
            const teamInput = process.env.GITHUB_TEAM.trim();
            const owner = context.repo.owner;

            // 1. Vérifier si l'application existe déjà (Information, non bloquant pour les Admins)
            const appDir = path.join('declaration', appName);
            if (fs.existsSync(appDir)) {
              console.log(`ℹ️ L'application '${appName}' existe déjà dans declaration/. Mise à jour autorisée pour l'administrateur.`);
            }

            // 2. Vérifier l'existence de la Team GitHub dans l'organisation (insensible à la casse)
            let matchedSlug = null;
            try {
              const teamsRes = await github.rest.teams.list({ org: owner, per_page: 100 });
              const match = teamsRes.data.find(t => 
                t.slug.toLowerCase() === teamInput.toLowerCase() || 
                t.name.toLowerCase() === teamInput.toLowerCase()
              );
              if (match) {
                matchedSlug = match.slug;
              }
            } catch (e) {
              console.log('Erreur requête teams:', e.message);
              // Fallback si token n'a pas accès à la lecture globale d'org : accepter le slug fourni
              matchedSlug = teamInput.toLowerCase();
            }

            if (!matchedSlug) {
              await github.rest.issues.createComment({
                owner: owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Erreur bloquante** : La Team GitHub \`${teamInput}\` est introuvable dans l'organisation \`${owner}\`.\n\nVeuillez vérifier le nom exact de l'équipe sur [Teams ${owner}](https://github.com/orgs/${owner}/teams).`
              });
              await github.rest.issues.update({
                owner: owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              core.setFailed(`Team ${teamInput} introuvable dans l'organisation.`);
            } else {
              core.setOutput('team_slug', matchedSlug);
            }

      # -----------------------------------------------------------------------
      # 5. Traitement Scénario C : Décompression du ZIP de masse (Admin)
      # -----------------------------------------------------------------------
      - name: "[Scénario C] Télécharger et traiter l'archive ZIP"
        if: steps.parse.outputs.operation == 'admin_bulk'
        env:
          ZIP_URL: ${{ steps.parse.outputs.zip_url }}
        run: |
          if [ -z "$ZIP_URL" ]; then
            echo "❌ Erreur : Aucune URL d'archive ZIP détectée dans l'Issue."
            exit 1
          fi

          echo "📥 Téléchargement de l'archive ZIP : $ZIP_URL"
          curl -sL -H "User-Agent: GitHub-Actions" "$ZIP_URL" -o bulk_update.zip

          python .github/scripts/process-bulk-zip.py \
            --zip-file bulk_update.zip \
            --declaration-dir declaration \
            --output-list ./parsed/modified_apps.txt

      # -----------------------------------------------------------------------
      # 6. Traitement Scénario D : Aspiration Entra ID (Reverse Engineering)
      # -----------------------------------------------------------------------
      - name: "[Scénario D] Azure Login (OIDC) & Extraction Graph API"
        if: steps.parse.outputs.operation == 'admin_import'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "[Scénario D] Exécuter le Reverse Engineering"
        id: reverse-engineer
        if: steps.parse.outputs.operation == 'admin_import'
        env:
          TARGET_APPS: ${{ steps.parse.outputs.target_applications }}
        run: |
          python .github/scripts/reverse-engineer-entra.py \
            --applications "$TARGET_APPS" \
            --declaration-dir declaration \
            --output-list ./parsed/imported_apps.txt \
            --error-file ./parsed/import_errors.txt

      - name: "[Scénario D] Notification d'échec d'import sur l'Issue"
        if: steps.parse.outputs.operation == 'admin_import' && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let errorDetails = "Une erreur est survenue lors de l'extraction depuis Microsoft Entra ID.";
            if (fs.existsSync('./parsed/import_errors.txt')) {
              const content = fs.readFileSync('./parsed/import_errors.txt', 'utf8').trim();
              if (content) {
                errorDetails = content;
              }
            }
            const issueNum = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: `❌ **Échec de l'importation depuis Microsoft Entra ID**\n\n\`\`\`text\n${errorDetails}\n\`\`\`\n\n---\n> ℹ️ **Règle de nomenclature obligatoire :**\n> Chaque Access Package d'une application doit impérativement respecter la convention : \`[Contexte/Sous-Application] [Niveau de Privilège] - [Environnement]\` *(ex: \`Credit Read Only - UAT\` ou \`Admin - Prod\`)*.\n> Si **un seul Access Package** ne respecte pas cette règle, l'import de l'application en entier est rejeté.\n>\n> 👉 **Pour corriger :** Ajustez le nom de l'Access Package directement dans le portail Microsoft Entra ID, puis relancez l'import.`
            });

      # -----------------------------------------------------------------------
      # 7. Création de la Branche Git & Commit des fichiers
      # -----------------------------------------------------------------------
      - name: Déterminer le nom de branche
        id: branch
        run: |
          OP="${{ steps.parse.outputs.operation }}"
          APP="${{ steps.parse.outputs.app_name }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          # Slugification pour garantir un nom de branche Git valide (minuscules, tirets au lieu d'espaces)
          APP_SLUG=$(echo "$APP" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-_')
          [ -z "$APP_SLUG" ] && APP_SLUG="app"

          case "$OP" in
            user_modify)  BRANCH="entitlement/modify-${APP_SLUG}-${TIMESTAMP}" ;;
            admin_create) BRANCH="admin/create-${APP_SLUG}-${TIMESTAMP}" ;;
            admin_bulk)   BRANCH="admin/bulk-${TIMESTAMP}" ;;
            admin_import) BRANCH="admin/import-entra-${TIMESTAMP}" ;;
            *)            BRANCH="entitlement/change-${TIMESTAMP}" ;;
          esac

          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          echo "app_slug=$APP_SLUG" >> $GITHUB_OUTPUT

      - name: Appliquer les modifications Git et pusher la branche
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          OP="${{ steps.parse.outputs.operation }}"
          APP_SLUG="${{ steps.branch.outputs.app_slug }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          if [ "$OP" = "user_modify" ] || [ "$OP" = "admin_create" ]; then
            mkdir -p "declaration/${APP_SLUG}"
            cp ./parsed/app.yaml "declaration/${APP_SLUG}/${APP_SLUG}.yaml"
            git add "declaration/${APP_SLUG}/${APP_SLUG}.yaml"
            git commit --allow-empty -m "feat(entitlement): [${OP}] ${APP_SLUG} — via Issue #${{ github.event.issue.number }}"
          elif [ "$OP" = "admin_bulk" ] || [ "$OP" = "admin_import" ]; then
            git add declaration/
            git commit --allow-empty -m "feat(entitlement): [${OP}] mise à jour déclarative — via Issue #${{ github.event.issue.number }}"
          fi

          git push origin "$BRANCH"

      # -----------------------------------------------------------------------
      # 8. Ouverture de la Pull Request Consolidée
      # -----------------------------------------------------------------------
      - name: Créer la Pull Request
        id: create-pr
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ steps.parse.outputs.operation }}
          APP_NAME: ${{ steps.parse.outputs.app_name }}
          GITHUB_TEAM: ${{ steps.validate-team.outputs.team_slug }}
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const op = process.env.OPERATION;
            const app = process.env.APP_NAME || '';
            const team = process.env.GITHUB_TEAM || '';
            const branch = process.env.BRANCH;
            const issueNum = process.env.ISSUE_NUM;

            // Vérifier si une PR existe déjà pour cette issue afin d'éviter tout doublon
            try {
              const existingPrs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 30
              });
              const duplicate = existingPrs.data.find(p =>
                p.title.includes(`(Issue #${issueNum})`) ||
                (p.body && p.body.includes(`Closes #${issueNum}`))
              );
              if (duplicate) {
                console.log(`⚠️ Une PR (#${duplicate.number}) existe déjà pour l'Issue #${issueNum}. Fin du workflow sans doublon.`);
                return;
              }
            } catch (err) {
              console.log('Vérification des doublons ignorée:', err.message);
            }

            let title = '';
            let desc = '';

            if (op === 'user_modify') {
              title = `✏️ [Modification] ${app} (Issue #${issueNum})`;
              desc = `Modification de l'application déclarative **${app}** soumise via l'Issue #${issueNum}.`;
            } else if (op === 'admin_create') {
              title = `🆕 [Création Admin] ${app} (Issue #${issueNum})`;
              desc = `Création de la nouvelle application **${app}**.\n\n<!-- GITHUB_TEAM: ${team} -->\n**Team GitHub Owner assignée :** \`@${context.repo.owner}/${team}\` (sera enregistrée dans \`CODEOWNERS\` lors du merge).`;
            } else if (op === 'admin_bulk') {
              title = `⚡ [Masse Admin] Modification groupée (Issue #${issueNum})`;
              desc = `Modification en masse de plusieurs fichiers YAML via archive ZIP (Issue #${issueNum}).`;
            } else if (op === 'admin_import') {
              title = `🔄 [Import Entra ID] Reverse Engineering (Issue #${issueNum})`;
              desc = `Import déclaratif d'applications depuis Microsoft Entra ID (Issue #${issueNum}).`;
            }

            const body = [
              `## ${title}`,
              '',
              desc,
              '',
              '---',
              `Closes #${issueNum}`,
              '',
              '> ℹ️ Le pipeline CI va valider le schéma, inspecter les ressources dans Entra ID et calculer le plan Terraform.'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: branch,
              base: 'main',
              body: body
            });

            // Commenter sur l'Issue avec lien vers la PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: `🚀 **Pull Request créée avec succès !**\n\nL'Issue est automatiquement clôturée et le traitement se poursuit sur la PR : #${pr.data.number} (${pr.data.html_url})`
            });

            // Clôturer automatiquement l'Issue dès la création de la PR
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              state: 'closed',
              state_reason: 'completed'
            });