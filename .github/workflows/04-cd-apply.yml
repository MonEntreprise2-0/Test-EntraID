# ============================================================================
# Workflow : CD — Déploiement Entra ID (100% PowerShell & CODEOWNERS)
# ============================================================================
name: "🚀 CD — Déploiement Entra ID"

on:
  push:
    branches: [main]
    paths:
      - 'declaration/**'
      - 'modules/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Forcer le déploiement de toutes les applications'
        type: boolean
        default: false
      target_app:
        description: 'Nom de l application spécifique (ex: CAT-latence)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  deploy-entraid:
    name: "⚡ Déploiement Entra ID"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 10

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ⚡ Déploiement déclaratif Microsoft Entra ID
        id: deploy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_DEPLOY_ALL: ${{ inputs.deploy_all }}
          INPUT_TARGET_APP: ${{ inputs.target_app }}
        run: |
          $deployParams = @{
              OutputSummaryFile = "deployment_summary.md"
          }
          if ($env:INPUT_DEPLOY_ALL -eq 'true') {
              $deployParams['All'] = $true
          } elseif ($env:INPUT_TARGET_APP) {
              $deployParams['ChangedFiles'] = @($env:INPUT_TARGET_APP)
          }
          & ./scripts/Deployer-Declarations.ps1 @deployParams

      - name: 📝 Commiter la mise à jour automatique de CODEOWNERS
        if: steps.deploy.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain .github/CODEOWNERS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/CODEOWNERS
            git commit -m "chore(governance): mise à jour automatique de CODEOWNERS [skip ci]"
            git push origin main
          fi
