# ============================================================================
# Workflow : CD - Terraform Apply (Déploiement automatique & CODEOWNERS)
# ============================================================================
name: "🚀 CD — Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - 'declaration/**'
      - 'terraform/**'

permissions:
  contents: write
  id-token: write
  pull-requests: read

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-apply:
    name: "⚡ Déploiement Entra ID"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: 🔎 Smart Discovery des catalogues Entra ID
        run: |
          python .github/scripts/discover-catalogs.py \
            --declarations-dir declaration \
            --output-file terraform/discovered_catalogs.json

      - name: Terraform Plan (pre-apply review)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "## 📋 Plan avant déploiement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "discovered_summary.md" ]; then
            cat discovered_summary.md >> $GITHUB_STEP_SUMMARY
          fi

          terraform plan \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -no-color \
            2>&1 | tee plan_output.txt

          PLAN_FILE="plan_output.txt"

          CREATES=$(grep -c '# .* will be created' $PLAN_FILE 2>/dev/null || echo "0")
          UPDATES=$(grep -c '# .* will be updated' $PLAN_FILE 2>/dev/null || echo "0")
          DESTROYS=$(grep -c '# .* will be destroyed' $PLAN_FILE 2>/dev/null || echo "0")
          NOCHANGE=$(grep -c 'No changes.' $PLAN_FILE 2>/dev/null || echo "0")

          echo "| Action | Nombre |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🆕 Créations | $CREATES |" >> $GITHUB_STEP_SUMMARY
          echo "| ✏️ Modifications | $UPDATES |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗑️ Suppressions | $DESTROYS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -auto-approve \
            -no-color \
            2>&1 | tee apply_output.txt

          APPLY_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$APPLY_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $APPLY_EXIT_CODE -ne 0 ]; then
            echo "Terraform apply a échoué."
            exit 1
          fi

      - name: 📝 Mettre à jour automatiquement le fichier CODEOWNERS
        if: steps.apply.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const codeownersPath = path.join('.github', 'CODEOWNERS');

            let codeownersContent = '';
            if (fs.existsSync(codeownersPath)) {
              codeownersContent = fs.readFileSync(codeownersPath, 'utf8');
            } else {
              codeownersContent = `# CODEOWNERS\n* @${owner}/admins\n`;
            }

            // Détecter les applications dans declaration/
            const decDir = 'declaration';
            let changed = false;

            if (fs.existsSync(decDir)) {
              const entries = fs.readdirSync(decDir, { withFileTypes: true });

              for (const dirent of entries) {
                if (dirent.isDirectory() && !dirent.name.startsWith('_')) {
                  const appName = dirent.name.toLowerCase();
                  const rulePrefix = `/declaration/${appName}/`;

                  if (!codeownersContent.includes(rulePrefix)) {
                    console.log(`Nouvelle application détectée sans règle CODEOWNERS : ${appName}`);

                    // Vérifier si un message de commit ou PR référence une team
                    let teamSlug = 'admins';
                    try {
                      const log = child_process.execSync('git log -1 --pretty=%B').toString();
                      const match = log.match(/GITHUB_TEAM:\s*([a-zA-Z0-9_-]+)/);
                      if (match) {
                        teamSlug = match[1];
                      }
                    } catch (e) {}

                    const newRule = `${rulePrefix} @${owner}/${teamSlug}`;
                    codeownersContent += `\n${newRule}`;
                    changed = true;
                    console.log(`Ajout de la règle : ${newRule}`);
                  }
                }
              }
            }

            if (changed) {
              fs.writeFileSync(codeownersPath, codeownersContent.trim() + '\n', 'utf8');
              console.log('Fichier CODEOWNERS actualisé.');
            }

      - name: Commiter la mise à jour de CODEOWNERS
        if: steps.apply.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain .github/CODEOWNERS)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/CODEOWNERS
            git commit -m "chore(governance): mise à jour automatique de CODEOWNERS [skip ci]"
            git push origin main
          fi

      - name: Fail workflow if Apply failed
        if: steps.apply.outcome != 'success'
        run: |
          echo "::error::Terraform apply a échoué."
          exit 1
