# ============================================================================
# Workflow : CD - Terraform Apply (Deploiement automatique)
# ============================================================================
name: "🚀 CD — Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - 'declarations/apps/**'
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform-apply:
    name: "\u26A1 Déploiement Entra ID"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: 🔎 Smart Discovery des catalogues Entra ID
        run: |
          python .github/scripts/discover-catalogs.py \
            --declarations-dir declarations/apps \
            --output-file terraform/discovered_catalogs.json

      - name: Terraform Plan (pre-apply review)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "## 📋 Plan avant déploiement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "discovered_summary.md" ]; then
            cat discovered_summary.md >> $GITHUB_STEP_SUMMARY
          fi

          terraform plan \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -no-color \
            2>&1 | tee plan_output.txt

          PLAN_FILE="plan_output.txt"

          # Compter les actions
          CREATES=$(grep -c '# .* will be created' $PLAN_FILE 2>/dev/null || echo "0")
          UPDATES=$(grep -c '# .* will be updated' $PLAN_FILE 2>/dev/null || echo "0")
          DESTROYS=$(grep -c '# .* will be destroyed' $PLAN_FILE 2>/dev/null || echo "0")
          NOCHANGE=$(grep -c 'No changes.' $PLAN_FILE 2>/dev/null || echo "0")

          echo "| Action | Nombre |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🆕 Créations | $CREATES |" >> $GITHUB_STEP_SUMMARY
          echo "| ✏️ Modifications | $UPDATES |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗑️ Suppressions | $DESTROYS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Détail des créations
          if [ "$CREATES" -gt 0 ]; then
            echo "### 🆕 Ressources à créer" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep '# .* will be created' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be created//')
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              case "$TYPE" in
                access_package_catalog) ICON="📦"; LABEL="Catalogue" ;;
                access_package) ICON="🎫"; LABEL="Access Package" ;;
                access_package_assignment_policy) ICON="📜"; LABEL="Politique d'assignation" ;;
                access_package_resource_catalog_association) ICON="🔗"; LABEL="Association ressource → catalogue" ;;
                access_package_resource_package_association) ICON="🔗"; LABEL="Association ressource → package" ;;
                *) ICON="📌"; LABEL="$TYPE" ;;
              esac
              echo "- $ICON **$LABEL** : \`$KEY\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Détail des modifications
          if [ "$UPDATES" -gt 0 ]; then
            echo "### ✏️ Ressources à modifier" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep '# .* will be updated' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be updated in-place//')
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              echo "- ✏️ **$TYPE** : \`$KEY\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Détail des suppressions
          if [ "$DESTROYS" -gt 0 ]; then
            echo "### 🗑️ Ressources à supprimer" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep '# .* will be destroyed' $PLAN_FILE | while read -r line; do
              RESOURCE=$(echo "$line" | sed 's/.*# //' | sed 's/ will be destroyed//')
              TYPE=$(echo "$RESOURCE" | sed 's/\..*//' | sed 's/azuread_//')
              KEY=$(echo "$RESOURCE" | grep -oP '\["[^"]*"\]' | tr -d '[]"' || echo "")
              echo "- 🗑️ **$TYPE** : \`$KEY\`" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$NOCHANGE" -gt 0 ] && [ "$CREATES" -eq 0 ] && [ "$UPDATES" -eq 0 ] && [ "$DESTROYS" -eq 0 ]; then
            echo "✅ **Aucun changement** — Entra ID est déjà à jour." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -o pipefail
          terraform apply \
            -var="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var="use_oidc=true" \
            -auto-approve \
            -no-color \
            2>&1 | tee apply_output.txt
        continue-on-error: true

      - name: Generate Deployment Summary
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "## 🚀 Résultat du déploiement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Statut** : ${{ steps.apply.outcome == 'success' && '✅ Succès' || '❌ Échec' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date** : $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            # Compter les actions dans apply
            APPLY_FILE="apply_output.txt"
            ADDED=$(grep -c 'Creation complete' $APPLY_FILE 2>/dev/null || echo "0")
            MODIFIED=$(grep -c 'Modifications complete' $APPLY_FILE 2>/dev/null || echo "0")
            DESTROYED=$(grep -c 'Destruction complete' $APPLY_FILE 2>/dev/null || echo "0")

            echo "### ✅ Actions réalisées dans Entra ID" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Action | Nombre |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🆕 Créées | $ADDED |" >> $GITHUB_STEP_SUMMARY
            echo "| ✏️ Modifiées | $MODIFIED |" >> $GITHUB_STEP_SUMMARY
            echo "| 🗑️ Supprimées | $DESTROYED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Lister les ressources créées
            if [ "$ADDED" -gt 0 ]; then
              echo "### Détail des créations" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              grep 'Creation complete' $APPLY_FILE | while read -r line; do
                RESOURCE=$(echo "$line" | grep -oP 'azuread_[^:]+' || echo "$line")
                echo "- ✅ \`$RESOURCE\`" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>📊 Outputs Terraform</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            terraform output -json summary 2>/dev/null | jq . >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Outputs non disponibles" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Erreurs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 30 apply_output.txt >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
