# ============================================================================
# Workflow : Telecharger un YAML existant (Cas 2 - Modification)
# ============================================================================
name: "📥 Télécharger un YAML existant"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: |
          Nom de l'application (kebab-case).
          Laissez vide pour afficher la liste de toutes les applications disponibles.
        required: false
        type: string

permissions:
  contents: read

jobs:

  list-or-download:
    name: "📋 Lister ou Télécharger"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Traiter la demande
        id: process
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # --- CAS 1 : Aucun nom fourni → lister les applications ---
          if [ -z "$APP_NAME" ]; then
            echo "## 📋 Applications disponibles" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            found=false
            for file in declarations/apps/*.yaml; do
              basename=$(basename "$file" .yaml)
              if [[ "$basename" == _* ]]; then continue; fi
              if [ -f "$file" ]; then
                found=true
                echo "| \`$basename\` | [📄 Voir le fichier](https://github.com/$REPO/blob/$BRANCH/$file) | [📥 Télécharger](https://raw.githubusercontent.com/$REPO/$BRANCH/$file) |" >> /tmp/table.md
              fi
            done

            if [ "$found" = true ]; then
              echo "| Application | Voir | Télécharger |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
              cat /tmp/table.md >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "---" >> $GITHUB_STEP_SUMMARY
              echo "### 💡 Comment modifier un YAML existant" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "1. Cliquez sur **📥 Télécharger** pour récupérer le fichier YAML" >> $GITHUB_STEP_SUMMARY
              echo "2. Modifiez-le localement selon vos besoins" >> $GITHUB_STEP_SUMMARY
              echo "3. Soumettez-le via **Issues** → **📦 Demande Entitlement Management** en choisissant **✏️ Modification**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Ou relancez ce workflow en saisissant le nom de l'application dans le champ **app_name** pour afficher le contenu directement." >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Aucune application trouvée dans \`declarations/apps/\`." >> $GITHUB_STEP_SUMMARY
            fi

            exit 0
          fi

          # --- CAS 2 : Nom fourni → afficher le contenu + télécharger ---
          FILE_PATH="declarations/apps/${APP_NAME}.yaml"

          if [ ! -f "$FILE_PATH" ]; then
            echo "## ❌ Application introuvable" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Le fichier \`${FILE_PATH}\` n'existe pas." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Applications disponibles :" >> $GITHUB_STEP_SUMMARY
            for file in declarations/apps/*.yaml; do
              basename=$(basename "$file" .yaml)
              if [[ "$basename" != _* ]] && [ -f "$file" ]; then
                echo "- \`$basename\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi

          echo "## ✅ Fichier trouvé : \`${APP_NAME}.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Télécharger le fichier](https://raw.githubusercontent.com/$REPO/$BRANCH/$FILE_PATH)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **[Voir sur GitHub](https://github.com/$REPO/blob/$BRANCH/$FILE_PATH)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Contenu actuel :" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat "$FILE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📝 Pour modifier, téléchargez le fichier, éditez-le, puis soumettez via **Issues** → **📦 Demande Entitlement Management** (type: ✏️ Modification)." >> $GITHUB_STEP_SUMMARY

          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Uploader le YAML en artefact
        if: ${{ github.event.inputs.app_name != '' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.process.outputs.app_name }}-yaml"
          path: "${{ steps.process.outputs.file_path }}"
          retention-days: 7