# ============================================================================
# Workflow : Télécharger un YAML existant (Libre-service)
# ============================================================================
name: "📥 Télécharger un YAML existant"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: |
          Nom de l'application (kebab-case).
          Laissez vide pour afficher la liste de toutes les applications disponibles.
        required: false
        type: string

permissions:
  contents: read

jobs:

  list-or-download:
    name: "📋 Lister ou Télécharger"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Traiter la demande
        id: process
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # --- CAS 1 : Aucun nom fourni → lister les applications ---
          if [ -z "$APP_NAME" ]; then
            echo "## 📋 Applications disponibles dans \`declaration/\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            found=false
            for dir in declaration/*/; do
              basename=$(basename "$dir")
              if [[ "$basename" == _* ]]; then continue; fi
              yaml_file="${dir}${basename}.yaml"
              if [ -f "$yaml_file" ]; then
                found=true
                echo "| \`$basename\` | [📄 Voir le fichier](https://github.com/$REPO/blob/$BRANCH/$yaml_file) | [📥 Télécharger](https://raw.githubusercontent.com/$REPO/$BRANCH/$yaml_file) |" >> /tmp/table.md
              fi
            done

            if [ "$found" = true ]; then
              echo "| Application | Voir | Télécharger |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
              cat /tmp/table.md >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "---" >> $GITHUB_STEP_SUMMARY
              echo "### 💡 Comment modifier un YAML existant" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "1. Cliquez sur **📥 Télécharger** pour récupérer le fichier YAML" >> $GITHUB_STEP_SUMMARY
              echo "2. Modifiez-le localement selon vos besoins" >> $GITHUB_STEP_SUMMARY
              echo "3. Soumettez-le via **Issues** → **✏️ [Utilisateur] Modification d'une application existante**" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Aucune application trouvée dans \`declaration/\`." >> $GITHUB_STEP_SUMMARY
            fi

            exit 0
          fi

          # --- CAS 2 : Nom fourni → afficher le contenu + télécharger ---
          APP_NAME_LOWER=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')
          FILE_PATH="declaration/${APP_NAME_LOWER}/${APP_NAME_LOWER}.yaml"

          if [ ! -f "$FILE_PATH" ]; then
            echo "## ❌ Application introuvable" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Le fichier \`${FILE_PATH}\` n'existe pas." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Applications disponibles :" >> $GITHUB_STEP_SUMMARY
            for dir in declaration/*/; do
              basename=$(basename "$dir")
              if [[ "$basename" != _* ]] && [ -f "${dir}${basename}.yaml" ]; then
                echo "- \`$basename\`" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi

          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "app_name_lower=$APP_NAME_LOWER" >> $GITHUB_OUTPUT

          echo "## ✅ Fichier trouvé : \`${APP_NAME_LOWER}.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Télécharger le fichier](https://raw.githubusercontent.com/$REPO/$BRANCH/$FILE_PATH)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **[Voir sur GitHub](https://github.com/$REPO/blob/$BRANCH/$FILE_PATH)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Contenu actuel :" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat "$FILE_PATH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📥 Téléchargez ce fichier, modifiez-le, puis déposez-le dans le formulaire **✏️ [Utilisateur] Modification d'une application existante**." >> $GITHUB_STEP_SUMMARY

      - name: Uploader l'artefact YAML
        if: success() && github.event.inputs.app_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.process.outputs.app_name_lower }}-yaml"
          path: "${{ steps.process.outputs.file_path }}"
          retention-days: 7