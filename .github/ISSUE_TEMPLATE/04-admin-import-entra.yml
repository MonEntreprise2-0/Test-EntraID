name: "🔄 [ADMIN ONLY] Import depuis Entra ID (Reverse Engineering)"
description: "Aspirer des applications existantes dans Entra ID et générer leurs fichiers déclaratifs (Réservé aux Administrateurs)"
title: "[Import Entra ID] Import d'applications existantes"
labels:
  - "entitlement-request"
  - "admin-reverse-engineering"
body:

  - type: markdown
    attributes:
      value: |
        ## 🔄 Import Déclaratif depuis Microsoft Entra ID (Reverse Engineering)

        > ⛔ **RESTRICTION DE SÉCURITÉ ADMIN :**
        > Ce formulaire est **strictement réservé aux administrateurs IAM**.
        >
        > Ce scénario permet d'exporter l'état réel des applications Entra ID vers le référentiel Git.
        > Le système créera ou mettra à jour l'arborescence normalisée `declaration/<app_name>/<app_name>.yaml`.
        >
        > ⚠️ **Règle d'écrasement (*Overwrite*) :**
        > Si l'application (`app_name`) saisie est déjà présente dans GitHub, son fichier existant sera **automatiquement écrasé et redéfini** par l'état réel extrait d'Entra ID.

  - type: textarea
    id: target_applications
    attributes:
      label: "Noms exacts des applications à importer (app_name)"
      description: "Saisissez les identifiants d'applications (app_name) séparés par des virgules (ex: test_sans_teraform, salesforce-crm, icredit). Si le fichier existe déjà sous declaration/<app_name>/, il sera écrasé avec la nouvelle définition."
      placeholder: "app_name1, app_name2..."
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: "Justification de l'import"
      description: "Précisez la raison de cet import (rattrapage T0, synchronisation après modification manuelle, audit)."
      placeholder: "Alignement initial T0 des applications historiques..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist de vérification"
      options:
        - label: "Je confirme être administrateur IAM habilité"
          required: true
        - label: "J'accepte l'écrasement des fichiers YAML existants pour ces applications"
          required: true
