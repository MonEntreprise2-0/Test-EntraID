name: "🆕 Créer un Access Package"
description: "Déclarer une nouvelle application et créer ses Access Packages dans Entra ID"
title: "[Création] <nom-application>"
labels:
  - "entitlement-request"
  - "creation"
body:

  - type: markdown
    attributes:
      value: |
        ## 🆕 Déclaration d'une nouvelle application (Format Ardian v2)
        
        Ce formulaire vous permet de créer un nouveau catalogue et ses Access Packages dans Entra ID.
        
        ### 📖 Guide rapide de rédaction du fichier YAML :
        Votre fichier `.yaml` doit définir :
        1. **`app_name`** : Identifiant unique et nom du catalogue en minuscules et tirets (ex: `salesforce-crm`).
        2. **`app_description`** : Description du catalogue (utilisée uniquement s'il faut le créer).
        3. **`access_packages`** : Liste des packages d'accès avec :
           - `context_subapp` (facultatif), `privilege_level` et `env` (ex: `Prod`, `UAT`)
           - `description` et `authorization_owners` (emails des approbateurs)
           - `owner_only` : `true` (admin uniquement) ou `false` (self-service MyAccess)
           - `resources` : liste des ressources (`Application Role`, `EntraID Group`, ou `Sharepoint Group`)
        
        > 💡 Pour un exemple complet et commenté, consultez : [`declarations/apps/_exemple-new.yaml`](../blob/main/declarations/apps/_exemple-new.yaml)

  - type: input
    id: app_name
    attributes:
      label: "Nom de l'application"
      description: "Identifiant unique en minuscules avec tirets (kebab-case). Doit correspondre EXACTEMENT à la valeur de `app_name` dans le YAML."
      placeholder: "ex: icredit"
    validations:
      required: true

  - type: textarea
    id: yaml_file
    attributes:
      label: "Fichier YAML déclaratif (Glisser-déposer)"
      description: "Glissez-déposez votre fichier `.yaml` directement dans cette zone (ou cliquez en bas de la zone pour le joindre)."
      placeholder: "Glissez et déposez votre fichier .yaml ici..."
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: "Justification métier"
      description: "Expliquez le contexte de cette demande (projet, équipe concernée, etc.)."
      placeholder: "Mise en place de la gouvernance des accès pour le projet..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist de conformité"
      options:
        - label: "Le champ `Nom de l'application` correspond au nom défini dans le YAML (`app_name`)"
          required: true
        - label: "Les ressources référencées (groupes, rôles applicatifs ou SharePoint) existent déjà dans Entra ID"
          required: true