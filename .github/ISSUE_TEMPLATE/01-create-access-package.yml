name: "🆕 Créer un Access Package"
description: "Déclarer une nouvelle application et créer ses Access Packages dans Entra ID"
title: "[Création] <nom-application>"
labels:
  - "entitlement-request"
  - "creation"
body:

  - type: markdown
    attributes:
      value: |
        ## 🆕 Déclaration d'une nouvelle application
        
        Ce formulaire vous permet de créer un nouveau catalogue et ses Access Packages dans Entra ID.
        
        ### 📖 Guide rapide de rédaction du fichier YAML
        Votre fichier `.yaml` doit définir 4 sections principales :
        1. **`application_name`** : Identifiant unique en minuscules et tirets (ex: `salesforce-crm`).
        2. **`catalog`** : Nom affiché dans MyAccess (ex: `display_name: "Salesforce CRM"`).
        3. **`resources`** : Groupes Entra ID à inclure (doivent pré-exister).
        4. **`access_packages`** : Paquets d'accès avec leurs rôles et politiques d'assignation.
        
        > 💡 Pour un exemple complet et commenté, consultez : [`declarations/apps/_example.yaml`](../blob/main/declarations/apps/_example.yaml)

  - type: input
    id: app_name
    attributes:
      label: "Nom de l'application"
      description: "Identifiant unique en minuscules avec tirets (kebab-case). Doit correspondre EXACTEMENT à la valeur de `application_name` dans le YAML."
      placeholder: "ex: mon-application"
    validations:
      required: true

  - type: textarea
    id: yaml_file
    attributes:
      label: "Fichier YAML déclaratif (Glisser-déposer)"
      description: "Glissez-déposez votre fichier `.yaml` directement dans cette zone (ou cliquez en bas de la zone pour le joindre)."
      placeholder: "Glissez et déposez votre fichier .yaml ici..."
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: "Justification métier"
      description: "Expliquez le contexte de cette demande (projet, équipe concernée, etc.)."
      placeholder: "Mise en place de la gouvernance des accès pour le projet..."
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist de conformité"
      options:
        - label: "Le champ `Nom de l'application` correspond au nom défini dans le YAML"
          required: true
        - label: "Les groupes de sécurité référencés existent déjà dans Entra ID"
          required: true