# ============================================================================
# FICHIER DÉCLARATIF — Entitlement Management Entra ID (Format Ardian v2)
# ============================================================================
# Ce fichier est un EXEMPLE commenté. Il est ignoré par les déploiements (préfixe _).
#
# Convention Ardian :
#   1 répertoire = 1 fichier YAML = 1 Application = 1 Catalogue Entitlement Management
#   Emplacement : declaration/CAT-<nomapplication>/CAT-<nomapplication>.yaml
#
# Rappel "Mode Consommateur" :
#   Ce pipeline ne crée AUCUNE ressource cible (groupes, apps, sites SharePoint).
#   Si une ressource référencée n'existe pas dans Entra ID, la CI bloquera
#   automatiquement le merge (Contrôle SSoT).
# ============================================================================

# ============================================================================
# NIVEAU 1 : LE CATALOGUE (APPLICATION)
# ============================================================================
# Ces champs décrivent l'application et son catalogue dans Entra ID.
# Le catalogue sera créé sous le nom CAT-<app_name> (ex: CAT-Mon Application).

app_name: "Mon Application"                   # [OBLIGATOIRE] Nom de l'application (format libre : majuscules, espaces autorisés).

app_description: "Description fonctionnelle libre de l'application"
                                              # [OBLIGATOIRE] Description du catalogue (aucune contrainte de longueur min/max).

# ============================================================================
# NIVEAU 2 : LES ACCESS PACKAGES (LISTE OPTIONNELLE)
# ============================================================================
# Chaque élément de cette liste crée un Access Package dans le catalogue.
# Si vous souhaitez créer un catalogue vide sans paquets d'accès, omettez cette section.
#
# IMPORTANT — Nommage automatique :
#   Le nom de l'Access Package est CONSTRUIT automatiquement par le pipeline :
#   Formule : [app_name] - [Context/Subapp] [Privilege Level] - [Env]
#   Si "context_subapp" est vide : [app_name] - [Privilege Level] - [Env]
#   Exemples :
#     - context_subapp: "SubApp", privilege_level: "Read Only", env: "PRD"
#       → Nom généré : "Mon Application - SubApp Read Only - PRD"
#     - context_subapp: "", privilege_level: "Admin", env: "UAT"
#       → Nom généré : "Mon Application - Admin - UAT"
#   Contrainte stricte : env DOIT être l'une des valeurs : DEV, UAT, PRD, TST, GLB
# ============================================================================

access_packages:

  # ==========================================================================
  # EXEMPLE 1 : Access Package avec Groupes Entra ID
  # ==========================================================================
  - context_subapp: "SubApp"          # [FACULTATIF] Notion métier / sous-application.
    privilege_level: "Read Only"      # [OBLIGATOIRE] Intention métier de l'accès.
    env: "PRD"                        # [OBLIGATOIRE] Environnement (DEV, UAT, PRD, TST, GLB).
    description: "Accès en lecture seule aux modules SubApp en production"
    authorization_owners:             # [FACULTATIF] Emails des approbateurs (si omis : aucune approbation requise).
      - "data-owner@ardian.com"
      - "backup-owner@ardian.com"

    resources:
      - resource_type: "EntraID Group" # [OBLIGATOIRE] Rôle "Member" assigné par défaut dans le package.
        group_name: "GRP-APP-SubApp-ReadOnly-Prod"

  # ==========================================================================
  # EXEMPLE 2 : Access Package avec Application Roles (Calcul automatique du rôle)
  # ==========================================================================
  - context_subapp: "Backend"
    privilege_level: "Admin"
    env: "PRD"
    description: "Accès administrateur complet au backend"
    authorization_owners:
      - "admin-owner@ardian.com"

    resources:
      - resource_type: "Application Role"
        enterprise_app: "app-backend"
        # app_role: [FACULTATIF] Si omis, le rôle cible est déduit automatiquement :
        # Formule : "{context_subapp} {privilege_level}" → ici "Backend Admin"

  # ==========================================================================
  # EXEMPLE 3 : Access Package avec SharePoint Group (Site & Groupe)
  # ==========================================================================
  - context_subapp: "Equipe"
    privilege_level: "Contributor"
    env: "GLB"
    description: "Accès au groupe SharePoint d'équipe"
    authorization_owners:
      - "sp-owner@ardian.com"

    resources:
      - resource_type: "Sharepoint Group"
        sharepoint_url: "https://monentreprise.sharepoint.com/sites/MonEquipe"
        sharepoint_group_name: "MonEquipe Membres"
